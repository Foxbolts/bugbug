[project]
name = "github-mcp-proxy"
version = "0.1.0"
description = "Mountable proxy to a read-only GitHub MCP server using caller-supplied tokens"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.26.0",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "mcp>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["github_mcp_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
